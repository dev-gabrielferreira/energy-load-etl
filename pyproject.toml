[project]
name = "energy-load-etl"
version = "0.1.0"
description = "Pipeline batch da curva de carga horaria do ONS: extract, validacao e Parquet particionado"
readme = "README.md"
authors = [
    { name = "Gabriel Ferreira", email = "dev.gabrielfer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
