[project]
name = "energy-load-etl"
version = "0.1.0"
description = "Pipeline batch da curva de carga horaria do ONS: extract, validacao e Parquet particionado"
readme = "README.md"
authors = [
    { name = "Gabriel Ferreira", email = "dev.gabrielfer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.103",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Com layout src/, a raiz do projeto nao entra no sys.path sozinha, e os testes
# importam os helpers de tests/conftest.py.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
