[server]
address = "0.0.0.0"
port = 8501
# Sem isso o container tenta abrir um navegador que nao existe.
headless = true
# O upload de arquivo nao e' usado em lugar nenhum do painel.
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# Erro de aplicacao nao vira traceback na tela de quem abriu o link.
showErrorDetails = "none"

# "viewer" mantem o menu do visitante, com o seletor de tema (claro, escuro ou o do
# sistema), e deixa de fora as opcoes de desenvolvedor. Com "minimal" o menu inteiro
# some, e some com ele a unica forma de trocar de tema: o Streamlit nao tem API para
# fazer isso por codigo, entao um seletor proprio na pagina sairia na base da giria.
toolbarMode = "viewer"
